table {

    label   = "Batch Agents"
    id      = "batch_agents"

    fields = [
        {
            label    = "Agent ID"
            id       = "agent_id"
            type     = "String"
            required = true
        },
        {
            label    = "Agent Label"
            id       = "agent_label"
            type     = "String"
            required = true
        },
        {
            label    = "Agent Type"
            id       = "agent_type"
            type     = "String"
            required = true
        }
    ]
}