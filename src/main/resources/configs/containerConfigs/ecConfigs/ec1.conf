ec {
    id              = "ec1"
    label           = "ec1"
    tcp-port        = 5000
    tcp-backlog     = 50
    class-path      = ""
    core-threads        = 5
    max-threads         = 10
    idle-timeout        = 60
    core-idle-timeout   = 120
    jvm-args        = [
            "-Xms256m",
            "-Xmx768m",
            "-XX:+UseG1GC",
            "-XX:+HeapDumpOnOutOfMemoryError",
            "-Dfile.encoding=UTF-8"
        ]
}