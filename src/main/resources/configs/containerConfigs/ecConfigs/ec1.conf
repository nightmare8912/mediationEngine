ec {
    id                  = "ec01"
    label               = "ec01"
    tcp-port            = 5100
    tcp-backlog         = 50
    main-class          = "org.prats.container.initializers.ExecutionContainerInitializer"
    class-path          = "mediation-engine.jar"
    control-port        = 15001
    core-threads        = 5
    max-threads         = 10
    idle-timeout        = 60
    core-idle-timeout   = 120

    # Database
    db-configured = false
    database-conf = ""

    jvm-args = [
            # Heap configuration
            "-Xms256m",
            "-Xmx768m",

            # Garbage collector
            "-XX:+UseG1GC",

            # Heap dump on OutOfMemoryError
            "-XX:+HeapDumpOnOutOfMemoryError",
            "-XX:HeapDumpPath=logs/ec01-heapdump-%p.hprof",

            # JVM fatal error logs
            "-XX:ErrorFile=logs/ec01-hs-err-%p.log",

            # Garbage collection and safepoint logging
            # Retain up to 5 files, each up to 20 MB
            "-Xlog:gc*,safepoint:file=logs/ec01-gc-%p.log:time,uptime,level,tags:filecount=5,filesize=20M",

            # Continuous Java Flight Recorder
            # Retain a rolling recording of the last 6 hours, capped at 256 MB
            "-XX:StartFlightRecording=name=ec01,settings=default,disk=true,maxage=6h,maxsize=256m,dumponexit=true,filename=logs/ec01-%p-%t.jfr",

            # Character encoding
            "-Dfile.encoding=UTF-8",

            # Mediation Engine logging
            "-Dmediation.file-logging.enabled=true",
            "-Dmediation.log.directory=logs"
        ]
    ec-configs      = [
            {
                "id"            = "ec02"
                tcp-port        = 10000
                control-port    = 15001
                startup-order   = 2
                "path" = "conf/containerConfigs/ecConfigs/ec2.conf"
            }
        ]
}