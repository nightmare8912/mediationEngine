platform {
    id                  = "platform"
    label               = "platform"
    tcp-port            = 15000
    tcp-backlog         = 50
    class-path          = "org.prats.platform.Platform"
    core-threads        = 5
    max-threads         = 10
    idle-timeout        = 60
    core-idle-timeout   = 120
    jvm-args        = [
            "-Xms256m",
            "-Xmx768m",
            "-XX:+UseG1GC",
            "-XX:+HeapDumpOnOutOfMemoryError",
            "-Dfile.encoding=UTF-8"
    ]
    ec-configs      = [
        {
            "id"    = "ec1"
            "path"   = "/Users/pratyush./Desktop/coding/mediationEngine2/src/main/resources/configs/containerConfigs/ecConfigs/ec1.conf"
        },
        {
            "id"    = "ec2"
            "path"   = "/Users/pratyush./Desktop/coding/mediationEngine2/src/main/resources/configs/containerConfigs/ecConfigs/ec2.conf"
        }
    ]
}