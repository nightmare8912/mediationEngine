platform {

    # Platform identifier
    id                  = "platform"
    label               = "platform"

    #Platform properties
    tcp-port            = 15000
    tcp-backlog         = 50
    control-port        = 15001
    main-class          = "org.prats.container.initializers.PlatformInitializer"
    class-path          = "mediation-engine.jar"
    core-threads        = 5
    max-threads         = 10
    idle-timeout        = 60
    core-idle-timeout   = 120

    # Databases
    database-conf = "conf/databaseConfigs/table_database.conf"

    # JVM Args for the platform
    jvm-args = [
        # Heap configuration
        "-Xms256m",
        "-Xmx768m",

        # Garbage collector
        "-XX:+UseG1GC",

        # Heap dump on OutOfMemoryError
        "-XX:+HeapDumpOnOutOfMemoryError",
        "-XX:HeapDumpPath=logs/platform-heapdump-%p.hprof",

        # JVM fatal error logs
        "-XX:ErrorFile=logs/platform-hs-err-%p.log",

        # Garbage collection and safepoint logging
        # Retain up to 5 files, each up to 20 MB
        "-Xlog:gc*,safepoint:file=logs/platform-gc-%p.log:time,uptime,level,tags:filecount=5,filesize=20M",

        # Continuous Java Flight Recorder
        # Retain a rolling recording of the last 6 hours, capped at 256 MB
        "-XX:StartFlightRecording=name=platform,settings=default,disk=true,maxage=6h,maxsize=256m,dumponexit=true,filename=logs/platform-%p-%t.jfr",

        # Character encoding
        "-Dfile.encoding=UTF-8",

        # Mediation Engine logging
        "-Dmediation.file-logging.enabled=true",
        "-Dmediation.log.directory=logs"
    ]

    # Configured ECs and their ports
    ec-configs      = [
        {
            "id"            = "ec01"
            tcp-port        = 5100
            control-port    = 15001
            startup-order   = 1
            path            = "conf/containerConfigs/ecConfigs/ec1.conf"
        },
        {
            "id"            = "ec02"
            tcp-port        = 10000
            control-port    = 15001
            startup-order   = 2
            path            = "conf/containerConfigs/ecConfigs/ec2.conf"
        }
    ]

    # configured watchdogs
    watchdog-configs    = [
        {
            id              = "wdg01"
            label           = "wdg01"
            host            = "127.0.0.1"
            control-port    = 15001
            path            = "conf/containerConfigs/watchdogConfigs/wdg1.conf"
        }
    ]
}