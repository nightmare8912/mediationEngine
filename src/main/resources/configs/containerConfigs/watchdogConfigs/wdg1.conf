
watchdog {
    # Watchdog identity
    id = "wdg01"
    label = "Watchdog 1"

    # PLATFORM connection
    platform-host = "127.0.0.1"
    platform-control-port = 15001

    # Application entry point
    main-class = "org.prats.container.initializers.WatchdogInitializer"

    # Bundled application JAR
    class-path = "mediation-engine.jar"

    # Database
    db-configured = false
    database-conf = ""

    # Thread configuration
    core-threads = 5
    max-threads = 10
    idle-timeout = 60

    # JVM arguments
    jvm-args = [
        # Heap configuration
        "-Xms256m",
        "-Xmx768m",

        # Garbage collector
        "-XX:+UseG1GC",

        # Heap dump on OutOfMemoryError
        "-XX:+HeapDumpOnOutOfMemoryError",

        # Character encoding
        "-Dfile.encoding=UTF-8"
    ]

    # Configured execution containers
    ec-configs = [
        {
            id = "ec01"
            tcp-port = 5100
            startup-order = 1
            path = "conf/containerConfigs/ecConfigs/ec1.conf"
        },
        {
            id = "ec02"
            tcp-port = 10000
            startup-order = 2
            path = "conf/containerConfigs/ecConfigs/ec2.conf"
        }
    ]
}
