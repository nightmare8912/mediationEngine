table {
    label   = "Users"
    id      = "users"
    fields = [
        {
            label       = "User Name"
            id          = "user_name"
            type        = "VARCHAR(30)"
            primary_key = true
            required    = true
        },
        {
            label       = "Password"
            id          = "password"
            type        = "VARCHAR(30)"
            required    = true
        },
        {
            label       = "Active"
            id          = "active"
            type        = "VARCHAR(1)"
            required    = true
        }
    ]
}