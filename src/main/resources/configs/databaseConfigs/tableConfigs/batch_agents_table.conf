table {
    label   = "Batch Agents"
    id      = "batch_agents"
    fields = [
        {
            label       = "Agent ID"
            id          = "agent_id"
            type        = "VARCHAR(15)"
            primary_key = true
            required    = true
        },
        {
            label       = "Agent Label"
            id          = "agent_label"
            type        = "VARCHAR(20)"
            required    = true
        },
        {
            label       = "Agent Type"
            id          = "agent_type"
            type        = "VARCHAR(15)"
            required    = true
        }
    ]
}